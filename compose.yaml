services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safearrival
      POSTGRES_USER: safearrival
      POSTGRES_PASSWORD: safearrival-local
    ports:
      - "5432:5432"
    volumes:
      - safearrival-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safearrival -d safearrival"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  safearrival-postgres:
